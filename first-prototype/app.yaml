command: ["streamlit", "run", "classic_dashboard.py"]
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: FACILITY_SNAPSHOT_TABLE
    valueFrom: facilities-table
  - name: SNAPSHOT_METADATA_TABLE
    valueFrom: snapshot-table
  - name: TRAVELTIME_APP_ID
    valueFrom: traveltime-app-id
  - name: TRAVELTIME_API_KEY
    valueFrom: traveltime-api-key
